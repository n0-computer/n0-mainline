name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Default to read-only; jobs that need more grant it explicitly.
permissions:
  contents: read

env:
  NEXTEST_VERSION: "0.9.80"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # actions-rs was archived in 2023 and its runner is too old for current
    # runners; rust-toolchain.toml already pins the channel.
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache cargo index
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-index-

    - name: Cache cargo build
      id: cargo-build-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('./Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-

    # Was a cargo install behind a cache keyed only on the OS, so whatever
    # binary landed there first was reused forever, unversioned.
    - name: Install cargo-nextest
      uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
      with:
        tool: nextest@${{ env.NEXTEST_VERSION }}

    - name: Check formatting
      id: fmt
      run: cargo fmt -- --check
      continue-on-error: true

    - name: Lint with Clippy
      run: cargo clippy --locked --workspace --bins --tests -- -D warnings

    - name: Build
      if: steps.cargo-build-cache.outputs.cache-hit != 'true'
      run: cargo build --locked --release --workspace --verbose

    - name: Run tests with Nextest
      run: cargo nextest run --locked --workspace --verbose

    - name: Run docs
      run: cargo doc --locked --workspace --no-deps --document-private-items --verbose

    - name: Fail if formatting check failed
      if: steps.fmt.outcome == 'failure'
      run: exit 1

  minimal-versions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
      with:
        toolchain: nightly
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
      with:
        toolchain: stable
    # No --locked on the update: re-resolving is the point, so
    # -Z min-publish-age guards the versions the lockfile has never seen.
    - name: Resolve to minimum versions
      run: |
        cargo +nightly -Z minimal-versions -Z min-publish-age update \
          --config 'registry.global-min-publish-age="3 days"'
    - name: Check lib at minimum versions
      run: cargo check --lib --locked

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      with:
        command: check
        arguments: --workspace --all-features
        command-arguments: "-Dwarnings"
